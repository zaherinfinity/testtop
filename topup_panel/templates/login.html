{% extends "base.html" %}
{% block title %}ចូលគណនី{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-secondary">
            <div class="card-body">
                <h3 class="card-title text-center"><i class="fas fa-sign-in-alt"></i> ចូលគណនី</h3>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label>ឈ្មោះអ្នកប្រើ</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>ពាក្យសម្ងាត់</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="remember" id="remember">
                        <label class="form-check-label" for="remember">ចងចាំខ្ញុំ</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">ចូល</button>
                </form>
                <div class="mt-3 text-center">
                    មិនមានគណនី? <a href="{{ url_for('register') }}">ចុះឈ្មោះ</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
