{% extends "base.html" %}
{% block title %}បញ្ចូលលុយ{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-secondary">
            <div class="card-body text-center">
                <h4><i class="fas fa-qrcode"></i> បញ្ចូលលុយតាម QR</h4>
                <img src="{{ url_for('static', filename='qr.jpg') }}" alt="QR Code" class="img-fluid my-3" style="max-width: 250px;">
                <p class="text-warning">1. ស្កេន QR<br>2. បញ្ចូលចំនួនទឹកប្រាក់ដូចគ្នា<br>3. ចុច “បានទូទាត់ប្រាក់”</p>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="$ ចំនួនទឹកប្រាក់" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100"><i class="fas fa-check-circle"></i> បានទូទាត់ប្រាក់</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
